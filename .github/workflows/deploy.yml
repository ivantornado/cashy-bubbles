name: Deploy to Cloudflare

# Only a merge to main goes live. Branches and pull requests never deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 493f6dc047d64ba3860ab10cedfb89bc

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gather the game files
        run: |
          mkdir _site
          cp -r index.html style.css game.js grid.js assets _site/
      - name: Deploy
        run: npx --yes wrangler@4 pages deploy _site --project-name cashy-bubbles --branch main --commit-message "${{ github.sha }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
